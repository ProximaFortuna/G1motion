# Fleet time server. Robots sync to this host so they agree with each other
# to ~1 ms over Wi-Fi, independent of internet NTP quality.

# Upstream (used when internet is available; harmless otherwise).
pool pool.ntp.org iburst maxsources 3

# Serve our own clock when no upstream is reachable. Stratum 10 so a client
# that has a better source is not confused; with "prefer trust" on the robots
# they follow us regardless.
local stratum 10 orphan

# Any client on the LAN may ask for time.
allow 0.0.0.0/0
allow ::/0

# Step the clock only in the first 3 updates if off by >1 s, then slew.
makestep 1 3
driftfile /var/lib/chrony/chrony.drift
cmdallow 127.0.0.1
